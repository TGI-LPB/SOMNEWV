<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>STOCK OPNAME MANDIRI (SOM)</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="h-full flex flex-col antialiased text-slate-800 select-none">

  <header class="bg-slate-900 text-white px-4 py-3 flex items-center justify-between sticky top-0 z-30 shadow-md">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-sm">SOM</div>
      <div>
        <h1 class="font-semibold text-sm leading-none">Stock Opname Mandiri</h1>
        <span id="active-location-display" class="text-xs text-slate-400">Lokasi: Belum Dipilih</span>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <span id="sync-status-badge" class="px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">ONLINE</span>
      <button id="logout-btn" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1m0-10V5"/></svg>
      </button>
    </div>
  </header>

  <main id="app-viewport" class="flex-1 overflow-y-auto p-4 pb-24 max-w-2xl mx-auto w-full">
    </main>

  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 px-6 py-2 flex justify-between items-center z-30 max-w-2xl mx-auto">
    <button onclick="Router.navigate('so')" class="nav-item flex flex-col items-center text-slate-500 hover:text-indigo-600 focus:outline-none">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      <span class="text-[10px] mt-1 font-medium">SO Scan</span>
    </button>
    <button onclick="Router.navigate('location')" class="nav-item flex flex-col items-center text-slate-500 hover:text-indigo-600 focus:outline-none">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/></svg>
      <span class="text-[10px] mt-1 font-medium">Lokasi</span>
    </button>
    <button onclick="Router.navigate('verification')" class="nav-item flex flex-col items-center text-slate-500 hover:text-indigo-600 focus:outline-none">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span class="text-[10px] mt-1 font-medium">Verifikasi</span>
    </button>
    <button onclick="Router.navigate('report')" class="nav-item flex flex-col items-center text-slate-500 hover:text-indigo-600 focus:outline-none">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 00-2 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      <span class="text-[10px] mt-1 font-medium">Report</span>
    </button>
  </nav>

  <div id="modal-container" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div id="modal-content" class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl transform transition-all scale-95 opacity-0"></div>
  </div>

  <div id="toast-container" class="fixed top-16 inset-x-0 flex flex-col items-center space-y-2 z-50 pointer-events-none px-4"></div>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/so.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
