<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stock Opname Mandiri</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F2F2F7">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="antialiased select-none">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="min-h-screen flex flex-col justify-between p-6">
    <div class="mt-12 text-center">
      <div class="w-20 h-20 bg-gray-200 rounded-3xl mx-auto flex items-center justify-center mb-4 shadow-inner">
        <svg class="w-10 h-10 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">SO Mandiri</h1>
      <p class="text-xs text-gray-500 mt-1">Sistem Stock Opname Mobile Pro</p>
    </div>

    <div class="ios-card p-6 space-y-4 shadow-sm">
      <div>
        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Username</label>
        <input type="text" id="loginUsername" class="ios-input w-full mt-1 text-sm" placeholder="Masukkan username">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Password</label>
        <div class="relative">
          <input type="password" id="loginPassword" class="ios-input w-full mt-1 text-sm pr-10" placeholder="Min 6 karakter">
          <button onclick="togglePasswordVisibility()" class="absolute right-3 top-3.5 text-gray-400">
            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          </button>
        </div>
      </div>
      <button onclick="execLogin()" class="ios-btn w-full py-3 text-center mt-2 shadow-sm">Masuk</button>
    </div>

    <div id="pwaInstallBanner" class="ios-card p-4 flex items-center justify-between border border-gray-100">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 bg-black text-white rounded-lg flex items-center justify-center font-bold text-xs">PWA</div>
        <div>
          <p class="text-xs font-semibold">Install Aplikasi</p>
          <p class="text-[10px] text-gray-400">Gunakan offline di iOS/Android</p>
        </div>
      </div>
      <button class="text-xs bg-gray-100 text-black px-3 py-1.5 rounded-full font-semibold">Install</button>
    </div>
  </div>

  <!-- MAIN APP SCREEN (DASHBOARD) -->
  <div id="appScreen" class="hidden min-h-screen flex flex-col pb-20">
    <div class="bg-white/80 backdrop-blur-md sticky top-0 z-40 px-5 py-4 border-b border-gray-200 flex justify-between items-center">
      <div>
        <p class="text-[10px] text-gray-400 uppercase font-bold">Logged in as</p>
        <h2 id="userDisplayName" class="text-base font-bold text-gray-800">Nama Staff</h2>
      </div>
      <div id="networkStatus" class="flex items-center space-x-1 px-2.5 py-1 rounded-full text-[10px] font-bold bg-green-100 text-green-700">
        <span class="w-2 h-2 rounded-full bg-green-500"></span>
        <span id="networkText">ONLINE</span>
      </div>
    </div>

    <main id="mainContainer" class="p-4 space-y-4">
      <!-- VIEW DASHBOARD MENU -->
      <div id="viewDashboard" class="grid grid-cols-2 gap-4">
        <button onclick="switchView('so')" class="ios-card p-5 text-left space-y-2 hover:bg-gray-50 transition">
          <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          </div>
          <p class="font-bold text-sm">Stock Opname</p>
          <p class="text-[10px] text-gray-400">Input / Scan barang baru</p>
        </button>

        <button onclick="switchView('verifikasi')" class="ios-card p-5 text-left space-y-2 hover:bg-gray-50 transition">
          <div class="w-10 h-10 rounded-full bg-orange-50 text-orange-600 flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </div>
          <p class="font-bold text-sm">Verifikasi</p>
          <p class="text-[10px] text-gray-400">Cek & validasi selisih Qty</p>
        </button>

        <!-- Menu Admin -->
        <button id="btnAdminMenu" onclick="switchView('adminUser')" class="ios-card p-5 text-left space-y-2 hover:bg-gray-50 transition hidden border border-purple-100 col-span-2">
          <div class="w-10 h-10 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          </div>
          <p class="font-bold text-sm">Kelola User Admin</p>
          <p class="text-[10px] text-gray-400">Tambah user & reset password</p>
        </button>
      </div>

      <!-- VIEW STOCK OPNAME (SO) -->
      <div id="viewSO" class="hidden space-y-4">
        <div class="ios-card p-4 space-y-3">
          <label class="text-xs font-bold text-gray-500 uppercase">1. Pilih / Input Lokasi</label>
          <input type="text" id="soLokasiInput" class="ios-input w-full text-sm" placeholder="Ketik Kode Lokasi (misal: RAK-A1)">
        </div>

        <div class="ios-card p-4 space-y-3">
          <div class="flex justify-between items-center">
            <label class="text-xs font-bold text-gray-500 uppercase">2. Scan / Barcode</label>
          </div>

          <div id="interactiveScanner" class="relative bg-black rounded-xl overflow-hidden h-48 flex items-center justify-center">
            <div id="reader" class="w-full h-full"></div>
            <div class="absolute inset-0 pointer-events-none border-2 border-white/30 flex items-center justify-center">
              <div class="w-48 h-24 border-2 border-red-500 rounded-lg relative">
                <div class="scanner-laser"></div>
              </div>
            </div>
          </div>

          <input type="text" id="inputBarcodeManual" onchange="onBarcodeScanned(this.value)" class="ios-input w-full text-sm font-mono" placeholder="Atau ketik Barcode / UPC lalu Enter">
        </div>

        <div class="ios-card p-4 space-y-2">
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div><span class="text-gray-400">Deskripsi:</span> <p id="outDeskripsi" class="font-bold text-gray-800">-</p></div>
            <div><span class="text-gray-400">Dept:</span> <p id="outDept" class="font-bold text-gray-800">-</p></div>
            <div><span class="text-gray-400">Vendor:</span> <p id="outVendor" class="font-bold text-gray-800">-</p></div>
            <div><span class="text-gray-400">Qty System:</span> <p id="outQtySys" class="font-bold text-blue-600">-</p></div>
          </div>
        </div>

        <div class="ios-card p-4 space-y-3">
          <label class="text-xs font-bold text-gray-500 uppercase">3. Qty Fisik & Keterangan</label>
          <div class="flex space-x-2">
            <input type="number" id="inputQtySO" class="ios-input w-1/3 text-center text-lg font-bold" placeholder="0">
            <input type="text" id="inputKetSO" class="ios-input w-2/3 text-sm" placeholder="Keterangan (Opsional)">
          </div>
          <button onclick="saveSOData()" class="ios-btn w-full py-3.5 text-center shadow-lg">Simpan Data SO</button>
        </div>
      </div>

      <!-- VIEW SETUP USER ADMIN -->
      <div id="viewAdminUser" class="hidden space-y-4">
        <div class="ios-card p-4 space-y-3">
          <h3 class="text-xs font-bold text-gray-500 uppercase">Tambah User Baru</h3>
          <input type="text" id="adminNewUsername" class="ios-input w-full text-sm" placeholder="Username">
          <input type="text" id="adminNewNama" class="ios-input w-full text-sm" placeholder="Nama Staff">
          <input type="password" id="adminNewPassword" class="ios-input w-full text-sm" placeholder="Password (Min 6 Karakter)">
          <select id="adminNewRole" class="ios-input w-full text-sm font-medium">
            <option value="staff">Role: Staff</option>
            <option value="admin">Role: Admin</option>
          </select>
          <button onclick="execAddUser()" class="ios-btn w-full py-3 text-center">Simpan User Baru</button>
        </div>

        <div class="ios-card p-4 space-y-3">
          <div class="flex justify-between items-center">
            <h3 class="text-xs font-bold text-gray-500 uppercase">Daftar Pengguna</h3>
            <button onclick="loadUserList()" class="text-xs text-blue-600 font-semibold">Refresh</button>
          </div>
          <div id="userListContainer" class="space-y-2 max-h-60 overflow-y-auto"></div>
        </div>
      </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg border-t border-gray-200 px-6 py-2 flex justify-between items-center z-50">
      <button onclick="switchView('dashboard')" class="flex flex-col items-center text-blue-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span class="text-[10px] mt-0.5">Home</span>
      </button>
      <button onclick="switchView('so')" class="flex flex-col items-center text-gray-400 hover:text-blue-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        <span class="text-[10px] mt-0.5">Scan SO</span>
      </button>
      <button onclick="execLogout()" class="flex flex-col items-center text-red-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        <span class="text-[10px] mt-0.5">Logout</span>
      </button>
    </nav>
  </div>

  
  <script src="js/db.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
